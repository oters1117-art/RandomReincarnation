<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤 다시 태어나기</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f3f4f6;
    color: #171717;
    font-family:
      -apple-system, BlinkMacSystemFont,
      "Pretendard", "Noto Sans KR",
      "Segoe UI", sans-serif;
  }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 50px;
  }

  .titleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  h1 {
    margin: 0;
    font-size: 28px;
  }

  .modeSwitch {
    display: inline-flex;
    flex-shrink: 0;
    padding: 3px;
    border-radius: 999px;
    background: #e5e7eb;
  }

  .modeSwitch button {
    border: 0;
    border-radius: 999px;
    padding: 8px 13px;
    background: transparent;
    color: #555;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .modeSwitch button.active {
    background: #111;
    color: #fff;
  }

  .modeSwitch button:focus-visible {
    outline: 3px solid rgba(17, 17, 17, .25);
    outline-offset: 2px;
  }

  .subtitle {
    margin-bottom: 18px;
    color: #666;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 14px;
  }

  .label {
    font-size: 13px;
    color: #777;
    margin-bottom: 5px;
  }

  .value {
    font-size: 20px;
    font-weight: 700;
    word-break: keep-all;
  }

  #mapBox {
    position: relative;
    background: white;
    border: 1px solid #ddd;
    border-radius: 16px;
    overflow: hidden;
  }

  #worldMap {
    display: block;
    width: 100%;
    height: auto;
  }

  .country {
    fill: #e6e8eb;
    stroke: #fff;
    stroke-width: .55;
  }

  .country.selected {
    fill: #ffcc4d;
    stroke: #222;
    stroke-width: 1.4;
  }

  #loading {
    padding: 60px 20px;
    text-align: center;
    color: #777;
  }

  #result {
    display: none;
    margin-top: 12px;
    padding: 18px;
    border-radius: 14px;
    background: #fff7d6;
    border: 1px solid #e8ca58;
  }

  #result strong {
    font-size: 25px;
  }

  #detail {
    margin-top: 6px;
    color: #555;
    line-height: 1.65;
  }

  .detailLine {
    display: block;
  }

  #rebirthBtn {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 17px;
    margin-top: 12px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }

  #rebirthBtn:hover {
    background: #1d4ed8;
  }

  #rebirthBtn:active {
    transform: translateY(1px);
  }

  .bottom {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  .history {
    margin-top: 7px;
    line-height: 1.7;
    word-break: keep-all;
  }

  .note {
    margin-top: 14px;
    color: #777;
    font-size: 13px;
    line-height: 1.6;
  }

  #supportBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 18px auto 0;
    min-width: 190px;
    height: 40px;
    padding: 9px 16px;
    border: 0;
    border-radius: 8px;
    background: #e5e7eb;
    color: #888;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    overflow: visible;
  }

  #supportBtn:hover {
    background: #d1d5db;
    color: #666;
  }

  #supportBtn.celebrating {
    background: #ef4444;
    color: #fff;
  }

  #supportBtn.celebrating .supportText {
    display: inline-block;
    font-size: 56px;
    line-height: 1;
  }

  .pinOuter {
    fill: rgba(255, 80, 60, .2);
    stroke: #e53625;
    stroke-width: 2;
  }

  .pinInner {
    fill: #e53625;
  }

  @media (max-width: 700px) {
    .titleRow {
      flex-wrap: wrap;
    }

    .stats {
      grid-template-columns: 1fr 1fr;
    }

    .bottom {
      grid-template-columns: 1fr;
    }

    h1 {
      font-size: 23px;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="titleRow">
    <h1>🌍 랜덤 다시 태어나기</h1>

    <div class="modeSwitch" role="group" aria-label="추첨 기준 선택">
      <button type="button" class="active" data-mode="births" aria-pressed="true">출생아 기준</button>
      <button type="button" data-mode="population" aria-pressed="false">인구 기준</button>
    </div>
  </div>

  <div class="subtitle" id="subtitle">
    2026년 전 세계에서 태어나는 아기 한 명을 무작위로 뽑습니다.
  </div>

  <div class="stats">
    <div class="card">
      <div class="label" id="totalLabel">연간 출생아</div>
      <div class="value" id="totalValue">계산 중</div>
    </div>

    <div class="card">
      <div class="label">이번 생</div>
      <div class="value" id="resultCountry">?</div>
    </div>

    <div class="card">
      <div class="label" id="chanceLabel">출생 확률</div>
      <div class="value" id="resultChance">—</div>
    </div>

    <div class="card">
      <div class="label">환생 횟수</div>
      <div class="value" id="rollCount">0</div>
    </div>
  </div>

  <div id="mapBox">
    <div id="loading">세계지도 불러오는 중…</div>

    <svg
      id="worldMap"
      viewBox="0 0 960 500"
      role="img"
      aria-label="랜덤 환생 세계지도"
      style="display:none">
    </svg>
  </div>

  <div id="result">
    당신은
    <strong id="bigCountry"></strong>에서
    다시 태어났습니다.

    <div id="detail"></div>
  </div>

  <button id="rebirthBtn" type="button">
    🎲 랜덤으로 다시 태어나기
  </button>

  <div class="bottom">

    <div class="card">
      <div class="label">최근 환생</div>
      <div class="history" id="history">
        아직 없음
      </div>
    </div>

  </div>

  <div class="note">
    <a href="https://population.un.org/wpp/" target="_blank" rel="noopener noreferrer">UN World Population Prospects 2024</a>의
    2026년 중위 추계 인구와 출생아 수를 사용합니다. 195개 국가·지역 합계로, UN 세계 합계의 출생아 약 99.88%와 인구 약 99.77%를 포함합니다.
  </div>

  <button id="supportBtn" type="button" aria-live="polite">
    <span class="supportText">제작자(둘기마요) 응원하기</span>
  </button>

</div>

"그레이트 짐바브웨 유적과 야생동물, 고원 풍경과 음악을 즐길 수 있어요.","statistics":["소비자물가 상승률: 약 104.7% · 세계 4위","전기 없는 인구: 약 38% · 세계 32위"]},{"id":"275","introduction":"예루살렘·베들레헴의 깊은 역사와 올리브, 풍성한 레반트 음식과 문화를 만날 수 있어요.","statistics":["가자지구 사망자: 약 58,600명","국내피난민: 약 2,032,000명 (국민 약 3명 중 1명)"]},{"id":"383","introduction":"젊은 도시문화와 오스만 유산, 산악 풍경과 푸짐한 발칸 음식을 즐길 수 있어요.","statistics":["청년 실업률: 약 19.5%","석탄 발전 비중: 약 93.4% · 세계 2위"]},{"id":"732","introduction":"사하라와 대서양이 만나는 장대한 풍경, 사하라위 유목문화와 차 전통을 경험할 수 있어요.","statistics":["해외 난민·망명신청자: 약 175,550명","식수 부족 가구: 약 59%"]}]/* PROFILE_DATA_END */;
const profilesById = new Map(profileData.map(profile => [profile.id, profile]));

const totalBirths = d3.sum(data, d => d.births);
const totalPopulation = d3.sum(data, d => d.population);
let currentMode = "births";

function formatCount(n) {
  if (n >= 100000000) {
    return (n / 100000000).toFixed(2) + "억";
  }
  if (n >= 10000) {
    return Math.round(n / 10000).toLocaleString("ko-KR") + "만";
  }
  return Math.round(n).toLocaleString("ko-KR");
}

function formatProbability(p) {
  const percent = p * 100;
  if (percent >= 1) return percent.toFixed(2) + "%";
  if (percent >= 0.01) return percent.toFixed(3) + "%";
  return percent.toFixed(5) + "%";
}

function formatOdds(probability) {
  return "약 " + Math.round(1 / probability).toLocaleString("ko-KR") + "번 중 1번";
}

function secureRandom() {
  const values = new Uint32Array(1);
  crypto.getRandomValues(values);
  return values[0] / 4294967296;
}

function weightedPick() {
  const totalWeight = currentMode === "births"
    ? totalBirths
    : totalPopulation;

  let random = secureRandom() * totalWeight;

  for (const item of data) {
    random -= currentMode === "births"
      ? item.births
      : item.population;

    if (random < 0) {
      return item;
    }
  }
  return data[data.length - 1];
}

const countries =
  feature(world, world.objects.countries);

const projection =
  d3.geoNaturalEarth1()
    .fitExtent(
      [[10, 10], [950, 490]],
      countries
    );

const path =
  d3.geoPath(projection);

const svg =
  d3.select("#worldMap");

svg.append("g")
  .selectAll("path")
  .data(countries.features)
  .join("path")
  .attr("class", "country")
  .attr("data-id", d => String(+d.id))
  .attr("d", path);

const pinLayer =
  svg.append("g");

function setMode(mode) {
  currentMode = mode;
  const isBirthMode = mode === "births";

  document.querySelectorAll(".modeSwitch button")
    .forEach(button => {
      const isActive = button.dataset.mode === mode;
      button.classList.toggle("active", isActive);
      button.setAttribute("aria-pressed", String(isActive));
    });

  document.getElementById("subtitle").textContent = isBirthMode
    ? "2026년 전 세계에서 태어나는 아기 한 명을 무작위로 뽑습니다."
    : "2026년 세계 인구 중 한 명을 무작위로 뽑습니다.";

  document.getElementById("totalLabel").textContent = isBirthMode
    ? "연간 출생아"
    : "세계인구";

  document.getElementById("totalValue").textContent =
    formatCount(isBirthMode ? totalBirths : totalPopulation) + "명";

  document.getElementById("chanceLabel").textContent = isBirthMode
    ? "출생 확률"
    : "인구 비례";

  document.getElementById("resultCountry").textContent = "?";
  document.getElementById("resultChance").textContent = "—";
  document.getElementById("result").style.display = "none";
  svg.selectAll(".country").classed("selected", false);
  pinLayer.selectAll("*").remove();
}

document.getElementById("loading").style.display = "none";
document.getElementById("worldMap").style.display = "block";
setMode("births");

let rolls = 0;
const history = [];

function rebirth() {
  const result = weightedPick();
  rolls++;

  const birthProbability = result.births / totalBirths;
  const populationProbability = result.population / totalPopulation;
  const probability = currentMode === "births"
    ? birthProbability
    : populationProbability;

  document.getElementById("resultCountry").textContent =
    result.name;

  document.getElementById("resultChance").textContent =
    formatProbability(probability);

  document.getElementById("rollCount").textContent =
    rolls.toLocaleString("ko-KR");

  document.getElementById("bigCountry").textContent =
    result.name;

  const profile = profilesById.get(result.id);
  const populationOdds = currentMode === "population"
    ? ", " + formatOdds(populationProbability)
    : "";
  const birthOdds = currentMode === "births"
    ? ", " + formatOdds(birthProbability)
    : "";
  const detailLines = [
    profile?.introduction,
    ...(profile?.statistics || []).map(statistic => "📊 " + statistic),
    "👥 인구 약 " + formatCount(result.population) + "명 (세계의 " +
      formatProbability(populationProbability) + populationOdds + ")",
    "👶 연간 출생아 약 " + formatCount(result.births) + "명 (세계의 " +
      formatProbability(birthProbability) + birthOdds + ")"
  ].filter(Boolean);
  const detail = document.getElementById("detail");
  detail.replaceChildren(...detailLines.map(text => {
    const line = document.createElement("span");
    line.className = "detailLine";
    line.textContent = text;
    return line;
  }));

  document.getElementById("result").style.display =
    "block";

  svg.selectAll(".country")
    .classed(
      "selected",
      d => String(+d.id) === String(+result.id)
    );

  pinLayer.selectAll("*").remove();

  const countryFeature =
    countries.features.find(
      d => String(+d.id) === String(+result.id)
    );

  if (countryFeature) {
    const centroid =
      projection(
        d3.geoCentroid(countryFeature)
      );

    if (
      centroid &&
      Number.isFinite(centroid[0]) &&
      Number.isFinite(centroid[1])
    ) {
      pinLayer.append("circle")
        .attr("class", "pinOuter")
        .attr("cx", centroid[0])
        .attr("cy", centroid[1])
        .attr("r", 10);

      pinLayer.append("circle")
        .attr("class", "pinInner")
        .attr("cx", centroid[0])
        .attr("cy", centroid[1])
        .attr("r", 4);
    }
  }

  history.push(result.name);

  if (history.length > 15) {
    history.shift();
  }

  document.getElementById("history").textContent =
    history.join(" → ");
}

document
  .getElementById("rebirthBtn")
  .addEventListener("click", rebirth);

document.querySelectorAll(".modeSwitch button")
  .forEach(button => {
    button.addEventListener("click", () => {
      if (button.dataset.mode !== currentMode) {
        setMode(button.dataset.mode);
      }
    });
  });

let supportTimer;

document.getElementById("supportBtn")
  .addEventListener("click", event => {
    const button = event.currentTarget;
    const text = button.querySelector(".supportText");

    clearTimeout(supportTimer);
    button.classList.add("celebrating");
    text.textContent = "🎉";

    supportTimer = setTimeout(() => {
      button.classList.remove("celebrating");
      text.textContent = "감사합니다";
    }, 1000);
  });

</script>
