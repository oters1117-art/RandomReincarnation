<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤 다시 태어나기</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f3f4f6;
    color: #171717;
    font-family:
      -apple-system, BlinkMacSystemFont,
      "Pretendard", "Noto Sans KR",
      "Segoe UI", sans-serif;
  }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px 50px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
  }

  .subtitle {
    margin-bottom: 18px;
    color: #666;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 14px;
  }

  .label {
    font-size: 13px;
    color: #777;
    margin-bottom: 5px;
  }

  .value {
    font-size: 20px;
    font-weight: 700;
    word-break: keep-all;
  }

  #mapBox {
    position: relative;
    background: white;
    border: 1px solid #ddd;
    border-radius: 16px;
    overflow: hidden;
  }

  #worldMap {
    display: block;
    width: 100%;
    height: auto;
  }

  .country {
    fill: #e6e8eb;
    stroke: #fff;
    stroke-width: .55;
  }

  .country.selected {
    fill: #ffcc4d;
    stroke: #222;
    stroke-width: 1.4;
  }

  #loading {
    padding: 60px 20px;
    text-align: center;
    color: #777;
  }

  #result {
    display: none;
    margin-top: 12px;
    padding: 18px;
    border-radius: 14px;
    background: #fff7d6;
    border: 1px solid #e8ca58;
  }

  #result strong {
    font-size: 25px;
  }

  #detail {
    margin-top: 6px;
    color: #555;
  }

  #rebirthBtn {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 17px;
    margin-top: 12px;
    background: #111;
    color: white;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }

  #rebirthBtn:hover {
    background: #333;
  }

  #rebirthBtn:active {
    transform: translateY(1px);
  }

  .bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  .history {
    margin-top: 7px;
    line-height: 1.7;
    word-break: keep-all;
  }

  .note {
    margin-top: 14px;
    color: #777;
    font-size: 13px;
    line-height: 1.6;
  }

  .pinOuter {
    fill: rgba(255, 80, 60, .2);
    stroke: #e53625;
    stroke-width: 2;
  }

  .pinInner {
    fill: #e53625;
  }

  @media (max-width: 700px) {
    .stats {
      grid-template-columns: 1fr 1fr;
    }

    .bottom {
      grid-template-columns: 1fr;
    }

    h1 {
      font-size: 23px;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>🌍 랜덤 다시 태어나기</h1>

  <div class="subtitle">
    세계 인구 중 인간 한 명을 무작위로 뽑습니다.
  </div>

  <div class="stats">
    <div class="card">
      <div class="label">모델 세계인구</div>
      <div class="value" id="worldPop">계산 중</div>
    </div>

    <div class="card">
      <div class="label">이번 생</div>
      <div class="value" id="resultCountry">?</div>
    </div>

    <div class="card">
      <div class="label">당첨 확률</div>
      <div class="value" id="resultChance">—</div>
    </div>

    <div class="card">
      <div class="label">환생 횟수</div>
      <div class="value" id="rollCount">0</div>
    </div>
  </div>

  <div id="mapBox">
    <div id="loading">세계지도 불러오는 중…</div>

    <svg
      id="worldMap"
      viewBox="0 0 960 500"
      role="img"
      aria-label="랜덤 환생 세계지도"
      style="display:none">
    </svg>
  </div>

  <div id="result">
    당신은
    <strong id="bigCountry"></strong>에서
    다시 태어났습니다.

    <div id="detail"></div>
  </div>

  <button id="rebirthBtn" type="button">
    🎲 랜덤으로 다시 태어나기
  </button>

  <div class="bottom">

    <div class="card">
      <div class="label">추첨 방식</div>
      <div>
        국가별 인구만큼 추첨권을 줍니다.
        세계 인구의 10%를 차지하는 나라라면
        한 번 누를 때 약 10% 확률입니다.
      </div>
    </div>

    <div class="card">
      <div class="label">최근 환생 · 왼쪽이 과거 / 오른쪽이 최신</div>
      <div class="history" id="history">
        아직 없음
      </div>
    </div>

  </div>

  <div class="note">
    현재 버전은 국가 단위입니다.
    지도 위 점은 선택된 국가의 대표 위치이며,
    실제 도시·동네까지 인구 비례로 추첨하는 기능은 아직 포함하지 않았습니다.
  </div>

</div>

  name,
  pop: pop * 1000000
}));

const total = d3.sum(data, d => d.pop);

document.getElementById("worldPop").textContent =
  (total / 100000000).toFixed(2) + "억";

function formatPopulation(n) {
  if (n >= 100000000) {
    return (n / 100000000).toFixed(2) + "억";
  }
  if (n >= 10000) {
    return Math.round(n / 10000).toLocaleString("ko-KR") + "만";
  }
  return Math.round(n).toLocaleString("ko-KR");
}

function formatProbability(p) {
  const percent = p * 100;
  if (percent >= 1) return percent.toFixed(2) + "%";
  if (percent >= 0.01) return percent.toFixed(3) + "%";
  return percent.toFixed(5) + "%";
}

function secureRandom() {
  const values = new Uint32Array(1);
  crypto.getRandomValues(values);
  return values[0] / 4294967296;
}

function weightedPick() {
  let random = secureRandom() * total;
  for (const item of data) {
    random -= item.pop;
    if (random < 0) {
      return item;
    }
  }
  return data[data.length - 1];
}

const countries =
  feature(world, world.objects.countries);

const projection =
  d3.geoNaturalEarth1()
    .fitExtent(
      [[10, 10], [950, 490]],
      countries
    );

const path =
  d3.geoPath(projection);

const svg =
  d3.select("#worldMap");

svg.append("g")
  .selectAll("path")
  .data(countries.features)
  .join("path")
  .attr("class", "country")
  .attr("data-id", d => String(+d.id))
  .attr("d", path);

const pinLayer =
  svg.append("g");

document.getElementById("loading").style.display = "none";
document.getElementById("worldMap").style.display = "block";

let rolls = 0;
const history = [];

function rebirth() {
  const result = weightedPick();
  rolls++;

  const probability = result.pop / total;
  const oneIn = Math.round(1 / probability);

  document.getElementById("resultCountry").textContent =
    result.name;

  document.getElementById("resultChance").textContent =
    formatProbability(probability);

  document.getElementById("rollCount").textContent =
    rolls.toLocaleString("ko-KR");

  document.getElementById("bigCountry").textContent =
    result.name;

  document.getElementById("detail").textContent =
    "모델 인구 약 " +
    formatPopulation(result.pop) +
    "명 · 세계의 " +
    formatProbability(probability) +
    " · 약 " +
    oneIn.toLocaleString("ko-KR") +
    "번 중 1번";

  document.getElementById("result").style.display =
    "block";

  svg.selectAll(".country")
    .classed(
      "selected",
      d => String(+d.id) === String(+result.id)
    );

  pinLayer.selectAll("*").remove();

  const countryFeature =
    countries.features.find(
      d => String(+d.id) === String(+result.id)
    );

  if (countryFeature) {
    const centroid =
      projection(
        d3.geoCentroid(countryFeature)
      );

    if (
      centroid &&
      Number.isFinite(centroid[0]) &&
      Number.isFinite(centroid[1])
    ) {
      pinLayer.append("circle")
        .attr("class", "pinOuter")
        .attr("cx", centroid[0])
        .attr("cy", centroid[1])
        .attr("r", 10);

      pinLayer.append("circle")
        .attr("class", "pinInner")
        .attr("cx", centroid[0])
        .attr("cy", centroid[1])
        .attr("r", 4);
    }
  }

  history.push(result.name);

  if (history.length > 6) {
    history.shift();
  }

  document.getElementById("history").textContent =
    history.join(" → ");
}

document
  .getElementById("rebirthBtn")
  .addEventListener("click", rebirth);

</script>

</html>
